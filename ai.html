    function openMobileDrawer() {
      document.getElementById('mobile-drawer-backdrop').classList.remove('hidden');

      drawer.classList.remove('hidden');
      drawer.classList.add('flex');
    }

    function closeMobileDrawer() {
      document.getElementById('mobile-drawer-backdrop').classList.add('hidden');
      const drawer = document.getElementById('mobile-drawer');
      drawer.classList.add('hidden');
      drawer.classList.remove('flex');
    }

    function fillMobileComposer(text) {
      const input = document.getElementById('mobile-composer-input');
      input.value = text;
      input.focus();
    }

    function attachMobileSampleVideo() {
      const row = document.getElementById('mobile-attachment-row');
      row.classList.remove('hidden');
      row.classList.add('flex');
      const input = document.getElementById('mobile-composer-input');
      if (!input.value.trim()) {
        input.value = '動画の「会」から「離れ」を見てください。';
      }
      input.focus();
    }

    function clearMobileAttachment() {
      const row = document.getElementById('mobile-attachment-row');
      row.classList.add('hidden');
      row.classList.remove('flex');
    }

    function resetMobileToWelcome() {
      document.getElementById('mobile-welcome-view').classList.remove('hidden');
      document.getElementById('mobile-welcome-view').classList.add('flex');
      document.getElementById('mobile-chat-thread').classList.add('hidden');
      document.getElementById('mobile-chat-thread').innerHTML = '';
      document.getElementById('mobile-composer-input').value = '';
      clearMobileAttachment();
    }

    function sendMobilePrompt(text) {
      document.getElementById('mobile-welcome-view').classList.add('hidden');
      document.getElementById('mobile-welcome-view').classList.remove('flex');
      const thread = document.getElementById('mobile-chat-thread');
      thread.classList.remove('hidden');
      thread.classList.add('flex');

      const userBubble = document.createElement('div');
      userBubble.className = 'flex justify-end';
      userBubble.innerHTML = '<div class="max-w-xs px-gutter-md py-gutter-sm rounded-2xl bg-light-surface-container-low text-light-on-surface font-body text-body-md">' + text + '</div>';
      thread.appendChild(userBubble);

      const aiBubble = document.createElement('div');
      aiBubble.className = 'flex items-start gap-gutter-sm';
      aiBubble.innerHTML = '<div class="w-7 h-7 rounded-full bg-light-primary text-light-on-primary flex items-center justify-center shrink-0 mt-1"><span class="material-symbols-outlined text-[15px]" aria-hidden="true">adjust</span></div><div class="flex-1 flex flex-col gap-gutter-xs text-light-on-surface font-body text-body-md text-pretty"><p>ご相談ありがとうございます。射形の安定には<strong>「左右の均等な伸び合い」</strong>と<strong>「呼吸の収まり」</strong>が鍵になります。</p><p>まずは会に入った後、息を静かに詰めながら両肩を水平に保ち、2〜3秒伸び合うところから試してみてください。</p></div>';
      thread.appendChild(aiBubble);
    }

    function loadMobileSample(key) {
      closeMobileDrawer();
      const prompts = {
        hayake: '早気を直すための会の保ち方を教えてください。',
        right: '離れで矢が右に抜ける原因は何が考えられますか？'
      };
      document.getElementById('mobile-chat-thread').innerHTML = '';
      sendMobilePrompt(prompts[key] || prompts.hayake);
    }

    function handleMobileSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('mobile-composer-input');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      clearMobileAttachment();
      sendMobilePrompt(val);
    }
  </script>


</body></html>
